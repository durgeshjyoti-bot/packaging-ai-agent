name: Build TIFF Plate Checker desktop app

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "tiff-check-desktop/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows-installer
          - os: macos-latest
            script: build:mac
            artifact: mac-installer
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tiff-check-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            tiff-check-desktop/dist/*.exe
            tiff-check-desktop/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Collect installers into one folder
        run: |
          mkdir -p release-assets
          find downloads -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: TIFF Plate Checker — latest desktop build
          body: |
            Automatically rebuilt from the latest commit on `${{ github.ref_name }}` (${{ github.sha }}).
            Unsigned builds — see `tiff-check-desktop/README.md` for the one-time Gatekeeper (Mac) / SmartScreen (Windows) bypass needed the first time you open it.
          files: release-assets/*
          make_latest: true
